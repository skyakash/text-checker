services:
  service:
    build:
      context: .
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    # Both sides of the port map honor SERVICE_PORT so the host publish
    # port matches the container bind by default. SERVICE_PUBLISH_PORT
    # remaps only the host side (e.g. bind on 8080 in the container but
    # publish on 9080 to the LAN — useful when 8080 is taken).
    ports:
      - "${SERVICE_PUBLISH_PORT:-${SERVICE_PORT:-8080}}:${SERVICE_PORT:-8080}"
    environment:
      SERVICE_HOST: ${SERVICE_HOST:-0.0.0.0}
      SERVICE_PORT: ${SERVICE_PORT:-8080}
      OLLAMA_BASE_URL: http://ollama:11434/v1
      DEFAULT_MODEL: qwen2.5:0.5b
      API_KEYS: dev-key-change-me
      LOG_LEVEL: INFO
      REDIS_URL: redis://redis:6379/0
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,ollama,redis,service,prometheus}
      SSL_CERT_FILE: ${SSL_CERT_FILE:-}
    depends_on:
      ollama:
        condition: service_healthy
      redis:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes:
      - ollama-data:/root/.ollama
    environment:
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:latest
    ports: ["9090:9090"]
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  # Optional MCP HTTP server for bots and remote agents.
  # Start with:  docker compose --profile mcp up -d
  mcp:
    profiles: ["mcp"]
    build:
      context: .
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    command: ["text-checker-mcp", "--http"]
    # MCP_PORT already env-configurable (mcp_server.py); publish port
    # tracks it. SERVICE_PORT feeds the internal URL to the main service
    # so a moved service port doesn't break the MCP -> service hop.
    ports:
      - "${MCP_PUBLISH_PORT:-${MCP_PORT:-8081}}:${MCP_PORT:-8081}"
    environment:
      MCP_HOST: ${MCP_HOST:-0.0.0.0}
      MCP_PORT: ${MCP_PORT:-8081}
      TEXT_CHECKER_URL: http://service:${SERVICE_PORT:-8080}
      TEXT_CHECKER_API_KEY: dev-key-change-me
      MCP_API_KEY: ${MCP_API_KEY:-dev-key-change-me}
    depends_on:
      service:
        condition: service_started

volumes:
  ollama-data:
